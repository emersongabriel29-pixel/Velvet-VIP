name: Staging verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  staging-contract:
    runs-on: ubuntu-latest
    env:
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_TEST_USER_A_EMAIL: ${{ secrets.STAGING_TEST_USER_A_EMAIL }}
      STAGING_TEST_USER_A_PASSWORD: ${{ secrets.STAGING_TEST_USER_A_PASSWORD }}
      STAGING_TEST_USER_B_EMAIL: ${{ secrets.STAGING_TEST_USER_B_EMAIL }}
      STAGING_TEST_USER_B_PASSWORD: ${{ secrets.STAGING_TEST_USER_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Staging configuration contract
        run: npm run test:staging-contract
      - name: Real staging integration suite
        if: ${{ env.STAGING_SUPABASE_URL != '' && env.STAGING_SUPABASE_ANON_KEY != '' }}
        run: npm run test:staging
      - name: Fail when real staging was not verified
        if: ${{ env.STAGING_SUPABASE_URL == '' || env.STAGING_SUPABASE_ANON_KEY == '' }}
        run: |
          echo "::error::Real staging was not verified. Configure STAGING_* secrets; repository contracts are insufficient."
          exit 1
