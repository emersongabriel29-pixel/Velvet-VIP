name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Automated contract tests
        run: npm test

      - name: FFmpeg media integration
        run: npm run test:media

      - name: Build media worker image
        run: docker build -f workers/media/Dockerfile -t velvet-media-worker:ci .

      - name: Production build
        run: npm run build
